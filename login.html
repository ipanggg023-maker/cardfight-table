<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanguard Table · Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
<script src="js/auth.js"></script>
<script src="js/loader.js"></script>
</head>
<body class="page login">
<div class="login-grid">
  <section class="hero">
    <svg class="hero-rings" viewBox="0 0 520 520" aria-hidden="true">
      <circle cx="260" cy="260" r="250" fill="none" stroke="#29446a" stroke-width="1.5"/>
      <circle cx="260" cy="260" r="190" fill="none" stroke="#29446a"/>
      <circle cx="260" cy="260" r="120" fill="none" stroke="#f2b94b" stroke-opacity=".5" stroke-width="1.5"/>
      <path d="M260 10V510M10 260H510" stroke="#29446a"/>
      <path d="M260 140L380 260L260 380L140 260Z" fill="none" stroke="#f2b94b" stroke-width="2"/>
    </svg>
    <img class="vg-banner" src="assets/banner.png" alt="" onerror="this.remove()">
    <div class="brand"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><path d="M28 3L53 28L28 53L3 28Z" fill="none" stroke="#f2b94b" stroke-width="3"/><path d="M28 15L41 28L28 41L15 28Z" fill="#f2b94b"/></svg><span>Vanguard Table</span></div>
    <h1>Ride into<br>the fight.</h1>
    <p>A private table for cardfights with friends. Build your own cards, ride your deck, and fight on one screen.</p>
    <div class="steps"><span>Ride</span><i>◆</i><span>Call</span><i>◆</i><span>Battle</span><i>◆</i><span>Trigger</span></div>
  </section>

  <section class="login-side">
    <form id="loginForm" class="login-card">
      <div class="lmodes" role="tablist">
        <button type="button" data-mode="in" role="tab">Sign in</button>
        <button type="button" data-mode="up" role="tab">Create account</button>
        <button type="button" data-mode="guest" role="tab">Guest</button>
      </div>
      <div>
        <h2 id="lTitle">Sign in</h2>
        <p id="lSub" class="muted"></p>
      </div>
      <div class="who" data-show="up guest">
        <span id="av" class="avatar">G</span>
        <span><b id="who">Guest</b><small id="whoSub" class="muted">Guest fighter</small></span>
      </div>
      <label class="field" data-show="in up">Email
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field" data-show="in up">Password
        <input id="pw" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
      </label>
      <label class="field" data-show="up guest">Fighter name
        <input id="name" maxlength="20" placeholder="Type your name" autocomplete="nickname">
      </label>
      <div class="field" data-show="up guest">Card sleeve color
        <div id="swatches" class="swatches" role="radiogroup" aria-label="Card sleeve color"></div>
      </div>
      <p id="lMsg" class="lmsg" hidden></p>
      <button id="lGo" type="submit" class="go big">Sign in</button>
    </form>
  </section>
</div>
<script>
  const COLORS = [["#5fd0ff", "Sky"], ["#f2b94b", "Gold"], ["#e85d74", "Crimson"], ["#6fd39a", "Jade"], ["#b896ff", "Violet"], ["#e8eef8", "Pearl"]];
  const MODES = {
    in: ["Sign in", "Your account keeps your coins and cards on every computer.", "Sign in"],
    up: ["Create account", "Free. Earn coins by playing and open packs in the Store.", "Create account"],
    guest: ["Play as guest", "No account needed. Your name and cards stay on this computer. No coins or Store.", "Enter as guest"],
  };
  const $ = (id) => document.getElementById(id);
  const prev = Auth.get();
  let mode = "in", color = (prev && prev.color) || COLORS[0][0], busy = false;
  $("name").value = (prev && prev.name) || "";
  function msg(t, ok) { const m = $("lMsg"); m.hidden = !t; m.textContent = t || ""; m.classList.toggle("ok", !!ok); }
  function setMode(m) {
    mode = m;
    const [t, sub, go] = MODES[m];
    $("lTitle").textContent = t; $("lSub").textContent = sub; $("lGo").textContent = go;
    document.querySelectorAll("[data-mode]").forEach((b) => { b.classList.toggle("on", b.dataset.mode === m); b.setAttribute("aria-selected", b.dataset.mode === m); });
    document.querySelectorAll("[data-show]").forEach((el) => { el.hidden = !el.dataset.show.split(" ").includes(m); });
    $("pw").autocomplete = m === "up" ? "new-password" : "current-password";
    $("whoSub").textContent = m === "guest" ? "Guest fighter" : "New player";
    msg("");
    paint();
  }
  function paint() {
    const n = $("name").value.trim();
    $("who").textContent = n || (mode === "guest" ? "Guest" : "Fighter");
    const av = $("av");
    av.textContent = (n[0] || "G").toUpperCase();
    av.style.background = color;
    $("swatches").innerHTML = COLORS.map(([c, l]) =>
      `<button type="button" role="radio" aria-checked="${c === color}" aria-label="${l} sleeve" data-c="${c}" class="sw${c === color ? " on" : ""}" style="background:${c}"></button>`).join("");
  }
  document.querySelector(".lmodes").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b && !busy) setMode(b.dataset.mode); });
  $("swatches").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b) { color = b.dataset.c; paint(); } });
  $("name").addEventListener("input", paint);
  const nice = (e) => {
    const t = (e && e.message) || String(e);
    if (/invalid login credentials/i.test(t)) return "Wrong email or password.";
    if (/already registered/i.test(t)) return "That email already has an account. Use Sign in.";
    if (/email not confirmed/i.test(t)) return "Open the link in the email we sent you first, then sign in.";
    if (/rate limit/i.test(t)) return "Too many tries. Wait a minute and try again.";
    return t;
  };
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const name = $("name").value.trim(), email = $("email").value.trim(), pw = $("pw").value;
    if (mode === "guest") {
      if (!name) return $("name").focus();
      Auth.set({ name, color, guest: true, since: (prev && prev.guest && prev.since) || new Date().toISOString() });
      return Loader.go("lobby.html");
    }
    if (!email) return $("email").focus();
    if (pw.length < 6) { msg("The password needs at least 6 characters."); return $("pw").focus(); }
    if (mode === "up" && !name) return $("name").focus();
    busy = true; $("lGo").disabled = true; msg("");
    const hide = Loader.show(mode === "up" ? "Creating your account…" : "Signing in…");
    try {
      if (mode === "up") {
        const r = await Cloud.signUp({ email, password: pw, name, color });
        if (r.confirm) { hide(); msg("Almost done: open the link in the email we sent you, then come back and sign in.", true); setMode("in"); msg("Almost done: open the link in the email we sent you, then come back and sign in.", true); return; }
      } else {
        const u = await Cloud.signIn(email, pw);
        if (!u) throw new Error("Sign-in failed. Try again.");
      }
      Loader.go("lobby.html");
    } catch (err) {
      hide(); msg(nice(err));
    } finally { busy = false; $("lGo").disabled = false; }
  });
  setMode(prev && prev.guest ? "guest" : "in");
</script>
</body>
</html>
